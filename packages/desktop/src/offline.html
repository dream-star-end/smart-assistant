<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenClaude Aurora 暂时离线</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #09090f;
        color: #f4f4f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 50% 15%, rgb(124 58 237 / 18%), transparent 38rem),
          #09090f;
      }
      main {
        width: min(30rem, calc(100vw - 3rem));
        padding: 2.5rem;
        text-align: center;
        border: 1px solid rgb(255 255 255 / 9%);
        border-radius: 1.25rem;
        background: rgb(18 18 27 / 88%);
        box-shadow: 0 2rem 6rem rgb(0 0 0 / 35%);
      }
      .mark {
        display: grid;
        width: 3.25rem;
        height: 3.25rem;
        margin: 0 auto 1.25rem;
        place-items: center;
        border-radius: 1rem;
        background: linear-gradient(135deg, #8b5cf6, #4f46e5);
        font-size: 1.35rem;
        font-weight: 750;
      }
      h1 {
        margin: 0;
        font-size: 1.45rem;
      }
      p {
        margin: 0.85rem 0 1.5rem;
        color: #a1a1aa;
        line-height: 1.65;
      }
      a {
        display: inline-block;
        padding: 0.72rem 1.2rem;
        color: white;
        text-decoration: none;
        border-radius: 0.7rem;
        background: #6d5ce7;
      }
      a:focus-visible {
        outline: 3px solid #c4b5fd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">OC</div>
      <h1>暂时无法连接 OpenClaude</h1>
      <p>请检查网络连接后重试。桌面端没有改动你的会话数据，恢复联网即可继续。</p>
      <a href="https://claudeai.chat/">重新连接</a>
    </main>
  </body>
</html>
