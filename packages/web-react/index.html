<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a08" />
    <meta name="description" content="从简 / Clarvy — 能思考、会执行、交付真实成果的全能 Agent 工作台。让复杂，从简。 From complex, to clear." />
    <meta name="oc-p0web-drill" content="OCV5-489" />
    <title>从简 · Clarvy</title>
    <!-- PWA:可安装到主屏 / 独立窗口运行。sw.js 在 main.tsx 内按需注册(仅安全上下文+生产)。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS 独立模式:全屏 + 状态栏透明(配合 viewport-fit=cover 铺满刘海/圆角安全区)。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="从简" />
    <script>
      try {
        // 取值校验与 src/hooks/useTheme.ts 的 parseTheme 同口径:脏值回落 system。
        var t = localStorage.getItem("oc_theme");
        if (t !== "light" && t !== "dark" && t !== "system") t = "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        // theme-color 两个分支都写,与 useTheme.ts 的 THEME_COLOR 取同一对值(useTheme.test 钉住):
        // 静态默认值是营销页黑 #090a08,原先只在 dark 时改写,浅色用户直接进工作区时状态栏先黑后白。
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute("content", dark ? "#0c0c11" : "#fafafb");
      } catch (e) {}
    </script>
    <!-- OCV5-421 首屏占位:JS 还没下载完时(弱网实测 40KB/s 下 30 秒以上)#root 是空的,只有一片空白。
         居中转圈;距导航开始满 4 秒才淡入「网络较慢，正在加载…」(见 #root 后的小脚本),正常网络下 React 挂载前看不到文字。
         React 首次渲染会替换 #root 的内容;生产构建里 React 等主样式表就绪才挂载(OCV5-422),之前一直是这个占位。
         占位只用这里的内联样式。颜色与 styles.css 的 --bg / --faint 一致。 -->
    <style>
      .oc-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fafafb;color:#64646f;font:13px/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      html.dark .oc-boot{background:#0c0c11;color:#92929b}
      .oc-boot-spin{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;opacity:.75;animation:oc-boot-spin .8s linear infinite}
      .oc-boot-hint{margin:0;opacity:0;animation:oc-boot-in .4s ease 4s forwards}
      @keyframes oc-boot-spin{to{transform:rotate(360deg)}}
      @keyframes oc-boot-in{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.oc-boot-spin{animation-duration:2.4s}.oc-boot-hint{animation-duration:0s}}
    </style>
  </head>
  <body>
    <div id="root"><div class="oc-boot" role="status" aria-live="polite"><span class="oc-boot-spin" aria-hidden="true"></span><p class="oc-boot-hint">网络较慢，正在加载…</p></div></div>
    <script>
      // 把提示的 4 秒延迟改成「距导航开始满 4 秒」,而不是从首次绘制算起。生产构建的主样式表已不阻塞绘制
      // (OCV5-422,vite.config.ts nonBlockingEntryCss),首帧通常就在 HTML 到达后;HTML 本身很慢时仍按导航算。
      try {
        var hint = document.querySelector(".oc-boot-hint");
        if (hint) hint.style.animationDelay = Math.max(0, 4000 - performance.now()) + "ms";
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
