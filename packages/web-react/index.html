<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="预置智能体平台 — 为每一件事，备好一位专家。开箱即用，无需挑模型、调提示词。" />
    <title>Aurora · 预置智能体平台</title>
    <script>
      try {
        var t = localStorage.getItem("oc_theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          // theme-color 同步写入:静态值是浅色,暗色用户首屏地址栏/状态栏会闪白。
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute("content", "#0c0c11");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
