<script id="fragment" type="x-shader/x-fragment">precision highp float;
uniform vec2 resolution;uniform float yaw,pitch,dist,seed,sun,water,biome,phase,mobile;
float hash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float noise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec3(3.7,1.8,7.2);a*=.5;}return v;}
mat3 ry(float a){float c=cos(a),s=sin(a);return mat3(c,0,-s,0,1,0,s,0,c);}
mat3 rx(float a){float c=cos(a),s=sin(a);return mat3(1,0,0,0,c,s,0,-s,c);}
void main(){
vec2 uv=(gl_FragCoord.xy-.5*resolution)/resolution.y;uv.x-=mix(.23,0.,mobile);uv.y-=mix(.055,.09,mobile);
vec3 ro=vec3(0,0,dist),rd=normalize(vec3(uv*2.,-1.85));
float neb=fbm(vec3(uv*2.4,7.1));vec3 col=vec3(.008,.016,.038)+vec3(.015,.035,.07)*pow(neb,3.);
vec2 cell=floor(gl_FragCoord.xy/3.);col+=vec3(.42,.61,.8)*step(.9986,hash(vec3(cell,11.)))*pow(hash(vec3(cell,12.)),2.);
float b=dot(ro,rd),c=dot(ro,ro)-1.,h=b*b-c;vec3 light=normalize(vec3(sin(sun),.35,cos(sun)));
float nearT=-b;vec3 closest=ro+rd*nearT;float rimDist=length(closest);
if(h>0.){
float t=-b-sqrt(h);vec3 pos=ro+rd*t,n=normalize(pos),q=ry(yaw+phase)*rx(pitch)*pos;
float terrain=fbm(q*2.8+vec3(seed*.37,seed*.11,seed*.21));float land=smoothstep(water-.008,water+.022,terrain);
float altitude=clamp((terrain-water)*4.,0.,1.),snow=smoothstep(.67,.94,abs(q.y)+altitude*.45);
vec3 ocean=mix(vec3(.006,.04,.12),vec3(.02,.25,.31),smoothstep(water-.12,water,terrain));
vec3 ground=mix(vec3(.075,.21,.13),vec3(.35,.36,.22),altitude);ground=mix(ground,vec3(.79,.85,.81),snow);vec3 base=mix(ocean,ground,land);
if(biome>.5&&biome<1.5)base=mix(mix(vec3(.14,.027,.02),vec3(.62,.22,.10),terrain),vec3(.85,.57,.29),smoothstep(.55,.75,terrain));
if(biome>1.5)base=mix(mix(vec3(.025,.1,.19),vec3(.58,.78,.83),land),vec3(.82,.93,.92),snow);
float diff=max(dot(n,light),0.),clouds=smoothstep(.60,.72,fbm(q*6.+vec3(phase*.2,8.,seed*.02)));base=mix(base,vec3(.91,.94,.97),clouds*.73);col=base*(.065+1.65*diff);
col+=vec3(.55,.83,1.)*pow(max(dot(reflect(-light,n),-rd),0.),55.)*(1.-land)*.9;
col+=vec3(.10,.42,.80)*pow(1.-max(dot(n,-rd),0.),3.3)*(.17+.83*diff);
float city=step(.84,noise(q*190.+seed))*step(water+.025,terrain)*(1.-snow)*(1.-clouds)*(1.-smoothstep(-.2,.12,dot(n,light)));
if(biome<.5)col+=vec3(1.,.48,.12)*city*.23;
}else if(rimDist<1.14&&nearT>0.)col+=vec3(.09,.38,.81)*exp(-(rimDist-1.)*26.)*.65*(.08+max(dot(normalize(closest),light),0.));
col=pow(vec3(1.)-exp(-col*1.3),vec3(.92));gl_FragColor=vec4(col,1.);
}</script><script>

const loc={};for(const n of ['resolution','yaw','pitch','dist','seed','sun','water','biome','phase','mobile'])loc[n]=gl.getUniformLocation(program,n);
const state={yaw:.2,pitch:.12,dist:3.2,seed:17,sun:.61,water:.48,biome:0,phase:0,rotate:!matchMedia('(prefers-reduced-motion: reduce)').matches};const $=id=>document.getElementById(id);
function rotation(){ $('rotation').textContent=state.rotate?'暂停自转':'开启自转';$('rotation').setAttribute('aria-pressed',String(state.rotate));}rotation();
function setRange(id,key,factor,format){$(id).oninput=()=>{state[key]=Number($(id).value)*factor;$(id+'Value').textContent=format($(id).value);};}

$('new').onclick=world;$('rotation').onclick=()=>{state.rotate=!state.rotate;rotation();};$('reset').onclick=()=>{Object.assign(state,{yaw:.2,pitch:.12,dist:3.2});$('distance').value='3.2';$('distanceValue').textContent='3.2 R';};
$('capture').onclick=()=>{try{const a=document.createElement('a');a.download='aurelia-'+state.seed+'.png';a.href=canvas.toDataURL('image/png');a.click();$('notice').textContent='已导出当前星球画面';}catch{$('notice').textContent='当前浏览器限制下载，请独立打开作品后保存。';}};

document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();world();}});
window.__planet={state,rendered:0};let last=performance.now();
function draw(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!document.hidden){if(state.rotate)state.phase+=dt*.06;const ratio=Math.min(devicePixelRatio,1.5),w=Math.round(innerWidth*ratio),h=Math.round(innerHeight*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}gl.uniform2f(loc.resolution,w,h);for(const k of ['yaw','pitch','dist','seed','sun','water','biome','phase'])gl.uniform1f(loc[k],state[k]);gl.uniform1f(loc.mobile,innerWidth<650?1:0);gl.drawArrays(gl.TRIANGLES,0,6);window.__planet.rendered++;}requestAnimationFrame(draw);}
$('renderState').textContent='LIVE / GPU RENDER';canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();$('renderState').textContent='渲染中断，请刷新';$('notice').textContent='GPU 上下文丢失。请刷新或更换浏览器。';});requestAnimationFrame(draw);
}catch(e){document.querySelector('#renderState').textContent='渲染初始化失败';document.querySelector('#notice').textContent='当前设备无法编译效果，请更换浏览器。';console.error(e);}
