# OpenClaude needrestart exclusions (OCV5-117 / R3).
#
# Verified on v3-dev-sg, needrestart 3.6 (2026-09-05, readonly):
#   - /etc/needrestart/conf.d/*.conf is parsed in Perl sort order and may
#     add keys to $nrconf{override_rc} (hash of regex → int).
#   - 0 = do not restart the matching systemd unit.
#   - Main config uses qr(^name) => 0; conf.d may use
#     $nrconf{override_rc}{q(^name)} = 0;  (Perl auto-derefs the hashref).
#   - needrestart matches the systemd unit name; a prefix without \.service$
#     is intentional so slice units and instance names stay excluded.
#
# Install with scripts/host/install-needrestart-exclusions.sh (idempotent).
# Do NOT install from a deploy agent — host owner installs once.
#
# These units will no longer be auto-restarted after library upgrades.
# Controlled restart after patches: see restart-excluded-units-checklist.md.

$nrconf{override_rc}{q(^openclaude-v5-deploy-)} = 0;
$nrconf{override_rc}{q(^openclaude-selfheal-tunnel)} = 0;
$nrconf{override_rc}{q(^openclaude-v5-selfhost)} = 0;
