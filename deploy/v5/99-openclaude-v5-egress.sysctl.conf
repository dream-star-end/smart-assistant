# OpenClaude v5 egress blue-green slots: two SO_REUSEPORT listeners share 172.31.0.1:18892.
# When the old slot closes, move connections still in its accept queue to the other listener
# instead of resetting them. Installed by scripts/v5-egress-slots.sh. Kernel >= 5.14.
net.ipv4.tcp_migrate_req = 1
