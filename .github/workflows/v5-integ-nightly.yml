name: Aurora v5 integ nightly

# 夜跑梯队(.github/integ-tiers/nightly-*.txt)。
#
# 为什么跟 PR 门分开:这 87 个文件覆盖管理面、连接器、自愈、账号池、单条 migration
# 回放等,价值真实但(a)墙钟太长、(b)对外部上游/docker 更敏感。放进 PR 阻塞路径
# 会重演 PR#131 —— integ job 撞 45min 全局 timeout,把合并卡死 8 天。
# 这里失败 = 开工单,不阻塞任何 PR。
#
# 分层判据与登记规则见 .github/integ-tiers/README.md;
# "新增 integ 文件必须被某梯队收录"由 npm run lint:integ-tiers 在 PR 门上守。

on:
  schedule:
    # 每日 19:00 UTC = 次日 03:00 沪时(低峰,和技能评测回归 04:30 错开)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: '只跑某一片(留空 = 全部 nightly-*)'
        required: false
        default: ''
      ref:
        description: 'checkout 的 git ref(留空 = 同时覆盖 feat/v5-aurora-rewrite 与 feat/v5-selfhost)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: v5-integ-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  nightly:
    name: integ ${{ matrix.branch }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        branch: [feat/v5-aurora-rewrite, feat/v5-selfhost]
        shard: [nightly-1, nightly-2, nightly-3, nightly-4, nightly-5]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openclaude_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d openclaude_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: 'true'
      REQUIRE_TEST_DB: '1'
      # nightly-5 含 agentSupervisor.integ(要 dockerd,GitHub runner 自带)。
      # 缺 docker 时它现在会 throw 而不是静默 skip —— 见该文件 REQUIRE_TEST_DOCKER。
      REQUIRE_TEST_DOCKER: '1'
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:55432/openclaude_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/0

    steps:
      - name: Skip non-selected shard or branch
        id: pick
        shell: bash
        run: |
          want_shard='${{ github.event.inputs.shard }}'
          want_ref='${{ github.event.inputs.ref }}'
          cur_branch='${{ matrix.branch }}'
          run="true"
          checkout_ref="$cur_branch"
          if [[ -n "$want_shard" && "$want_shard" != '${{ matrix.shard }}' ]]; then
            run="false"
          elif [[ -n "$want_ref" ]]; then
            if [[ "$want_ref" == "feat/v5-aurora-rewrite" || "$want_ref" == "feat/v5-selfhost" ]]; then
              if [[ "$want_ref" != "$cur_branch" ]]; then
                run="false"
              fi
            elif [[ "$cur_branch" != "feat/v5-aurora-rewrite" ]]; then
              run="false"
            fi
            checkout_ref="$want_ref"
          fi
          branch_slug="$(printf '%s' "$checkout_ref" | tr '/:@ ' '----' | tr -cd 'A-Za-z0-9._-')"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "branch_slug=${branch_slug:-branch}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.pick.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.ref }}

      - name: Record checkout identity
        if: steps.pick.outputs.run == 'true'
        shell: bash
        run: |
          echo "checked out $(git rev-parse HEAD) from ref=${{ steps.pick.outputs.ref }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        if: steps.pick.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.pick.outputs.run == 'true'
        run: npm ci

      - name: Wait for test fixtures
        if: steps.pick.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec '${{ job.services.postgres.id }}' pg_isready -U test -d openclaude_test; then
              break
            fi
            if [[ "$i" == 30 ]]; then
              echo 'Postgres did not become ready in time' >&2
              exit 1
            fi
            sleep 2
          done
          for i in {1..30}; do
            if docker exec '${{ job.services.redis.id }}' redis-cli ping; then
              break
            fi
            if [[ "$i" == 30 ]]; then
              echo 'Redis did not become ready in time' >&2
              exit 1
            fi
            sleep 2
          done

      - name: Run integ shard ${{ matrix.shard }}
        if: steps.pick.outputs.run == 'true'
        env:
          TAP_OUT: commercial-integ-${{ matrix.shard }}.tap
        run: |
          sudo env \
            "PATH=$PATH" \
            "CI=$CI" \
            "REQUIRE_TEST_DB=$REQUIRE_TEST_DB" \
            "REQUIRE_TEST_DOCKER=$REQUIRE_TEST_DOCKER" \
            "TEST_DATABASE_URL=$TEST_DATABASE_URL" \
            "TEST_REDIS_URL=$TEST_REDIS_URL" \
            "TAP_OUT=$TAP_OUT" \
            bash .github/scripts/commercial-integ-gate.sh '${{ matrix.shard }}'

      - name: Upload TAP output
        if: always() && steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: commercial-integ-tap-${{ steps.pick.outputs.branch_slug }}-${{ matrix.shard }}
          path: commercial-integ-${{ matrix.shard }}.tap
          if-no-files-found: error
          retention-days: 14

  # OCV5-906: 高强度状态机属性测试 (PBT_RUNS=2000) + 周度 T2 核心增量变异抽检
  selfhost-pbt-and-mutation:
    name: selfhost PBT (2000 runs) & weekly mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feat/v5-selfhost
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'feat/v5-selfhost' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run 4 core state-machine property tests (PBT_RUNS=2000)
        env:
          PBT_RUNS: '2000'
        run: |
          npx tsx --test \
            packages/kernel/src/testing/__tests__/propertyCheck.test.ts \
            packages/commercial/src/__tests__/prop.billingConservation.test.ts \
            packages/commercial/src/__tests__/prop.multiTenantIsolation.test.ts \
            packages/gateway/src/__tests__/prop.turnLeaseConvergence.test.ts \
            packages/storage/src/__tests__/prop.journalTapeRecovery.test.ts

      - name: Weekly incremental mutation spot-check (Sundays & manual dispatch)
        id: mutation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
            npx tsx scripts/check-mutation-weekly.ts --days 7 --min-score 0.60 --max-mutants 20 --json --out mutation-weekly-report.json
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "Skipping weekly mutation spot-check on weekday $(date -u +%A)"
          fi

      - name: Upload mutation weekly report
        if: always() && steps.mutation.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-mutation-weekly-report
          path: mutation-weekly-report.json
          if-no-files-found: ignore
          retention-days: 14
