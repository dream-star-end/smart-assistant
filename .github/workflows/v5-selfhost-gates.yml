name: V5 selfhost gates

# 个人版(feat/v5-selfhost)的仓库级门(OCV5-376)。此前这些检查只有商业 v5-ci.yml 跑
# (只触发 feat/v5-aurora-rewrite),在个人版树上从没跑过:事故账本里一条 assertion 锚点
# 早已改名也没人发现,整包 lint 永远红。这里跑的是个人版能真实通过、失败即有意义的版本。
#   · biome:只看本次改动的文件,只拦新增错误(scripts/check-biome-changed.sh);
#   · 事故账本:check-v5-incident-regressions.ts --edition=selfhost + ledger superset;
#   · 两树差异:只报告不拦(两棵树统一同步之后改成 --enforce)。

on:
  pull_request:
    branches: [feat/v5-selfhost]
  push:
    branches: [feat/v5-selfhost]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: v5-selfhost-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  # OCV5-847 (P0-5): 常规 PR/push 显式封堵跳过/降级逃生环境变量，不接受外部绕过。
  OC_TEST_RETRY_ENFORCE: '1'
  OC_V5_SKIP_TRAILER_GATE: '0'
  OC_V5_ALLOW_BREAKING_MIGRATION: '0'
  V5_SMOKE_E2E: '1'
  BOSS_APPROVED_CHANGELOG: '0'

jobs:
  gates:
    name: selfhost-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 账本血缘、trailer 闭环与两树差异都要完整历史和 feat/v5-aurora-rewrite。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 比较基线:PR 用目标分支;push 用推送前的 SHA(否则 origin/feat/v5-selfhost 就是 HEAD 本身,
      # 改动文件为 0、账本与自己比,门形同虚设)。新建分支的 push(before 全 0)退回目标分支。
      - name: Resolve comparison base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ref="origin/$BASE_REF"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ref="$BEFORE"
          else
            ref="origin/feat/v5-selfhost"
          fi
          git rev-parse --verify "$ref^{commit}" >/dev/null
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "comparison base: $ref"

      # OCV5-450:列车迁移门的两项先在 PR 上跑:未列入 requiredMigrations 即红;
      # 破坏性 DDL 只标注(发布时仍需用户批准 + OC_V5_ALLOW_BREAKING_MIGRATION=1)。
      - name: Migration precheck (same rules as the train's migration gate)
        run: bash scripts/v5-selfhost-migration-precheck.sh --base "${{ steps.base.outputs.ref }}"

      # 大文件棘轮(FINDINGS §7 / ARC-3):已 >3000 行的源码文件不许净增,其余不得超过 3000 行;
      # 例外写 .github/file-size-ratchet-exceptions.json(ticket/reason/≤30 天到期)。
      - name: Large source file ratchet
        run: npx tsx scripts/check-file-size-ratchet.ts --base "${{ steps.base.outputs.ref }}"

      - name: Biome (changed files, no new errors)
        run: bash scripts/check-biome-changed.sh --base "${{ steps.base.outputs.ref }}"

      - name: Incident ledger (selfhost edition)
        env:
          INCIDENT_LEDGER_BASE_REF: ${{ steps.base.outputs.ref }}
        run: npx tsx scripts/check-v5-incident-regressions.ts --edition=selfhost

      - name: Incident ledger superset
        env:
          INCIDENT_LEDGER_BASE_REF: ${{ steps.base.outputs.ref }}
        run: npx tsx scripts/check-incident-ledger-superset.ts

      # OCV5-847 (P0-4 / Blocker 3): 补齐已在 Aurora 稳定运行的秒级快门；全部直调 A 类 CODEOWNERS 保护脚本，
      # 不经未锁定的 package.json npm run 间接跳转，杜绝篡改脚本映射绕过。
      - name: Scheduler wiring lint
        run: npx tsx scripts/check-schedulers.ts

      - name: Agent containers SQL state-filter lint
        run: npx tsx packages/commercial/scripts/lint-agent-containers-sql.ts

      - name: No silent test retries (enforced)
        env:
          OC_TEST_RETRY_ENFORCE: '1'
        run: npx tsx scripts/check-v5-test-retries.ts

      - name: Integration test tiers manifest drift gate
        run: npx tsx scripts/check-integ-tiers.ts

      - name: E2E selectors existence gate
        run: npx tsx scripts/check-v5-e2e-selectors.ts

      # OCV5-847 (P0-3 / P0-4 / P0-7 / Blocker 3 & 4): 新增 V5 治理秒级快门与跨基线单调防篡改校验。
      - name: Governance docs links gate
        run: npx tsx scripts/check-docs-links.ts

      - name: UI static hard gates (single-writer scroll, z-index, zero-learning copy, reduced-motion)
        run: npx tsx scripts/check-ui-hard-gates.ts

      - name: No silent weak-model downgrade gate
        run: npx tsx scripts/check-no-silent-model-downgrade.ts

      - name: Multi-tenant V5 route sync gate
        run: npx tsx scripts/check-v5-route-sync.ts

      - name: Monotonic governance baselines ratchet
        run: npx tsx scripts/check-monotonic-baselines.ts --base "${{ steps.base.outputs.ref }}"

      - name: Changelog human-approval guard
        env:
          BOSS_APPROVED_CHANGELOG: '0'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          APPROVED_COMMIT=""
          # 仅当 changelog.json 发生变更时，通过受信任 GitHub API 核验 @dream-star-end 对精确提交的 APPROVED 审批。
          if [ -n "$(git diff --name-only "$BASE_REF...HEAD" -- changelog.json)" ]; then
            if [ "$EVENT" = "pull_request" ] && [ -n "$PR_NUMBER" ] && [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              parent2="$(git rev-parse --verify --quiet HEAD^2 || true)"
              if [ "$PR_HEAD_SHA" = "$HEAD_SHA" ] || [ "$PR_HEAD_SHA" = "$parent2" ]; then
                if gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
                  | jq -es --arg sha "$PR_HEAD_SHA" --arg head "$HEAD_SHA" \
                      'add | [.[] | select(.user.login == "dream-star-end" and .state != "COMMENTED")] | last | (.state == "APPROVED" and (.commit_id == $sha or .commit_id == $head))' >/dev/null 2>&1; then
                  APPROVED_COMMIT="$HEAD_SHA"
                fi
              fi
            elif [ "$EVENT" = "push" ]; then
              MERGE_BASE="$(git merge-base "$BASE_REF" HEAD)"
              CHANGELOG_SHA="$(git log -n 1 --format=%H "${MERGE_BASE}..HEAD" -- changelog.json || true)"
              TARGET_SHA="${CHANGELOG_SHA:-$HEAD_SHA}"
              while IFS=$'\t' read -r pr_num pr_head pr_merge; do
                [ -n "$pr_num" ] || continue
                if [ "$pr_merge" != "$TARGET_SHA" ] && [ "$pr_head" != "$TARGET_SHA" ]; then
                  continue
                fi
                if gh api --paginate "repos/${GH_REPO}/pulls/${pr_num}/reviews" \
                  | jq -es --arg sha "$pr_head" --arg target "$TARGET_SHA" \
                      'add | [.[] | select(.user.login == "dream-star-end" and .state != "COMMENTED")] | last | (.state == "APPROVED" and (.commit_id == $target or .commit_id == $sha))' >/dev/null 2>&1; then
                  APPROVED_COMMIT="$TARGET_SHA"
                  break
                fi
              done < <(
                gh api --paginate "repos/${GH_REPO}/commits/${TARGET_SHA}/pulls" \
                  | jq -rs 'add | (. // []) | .[] | select(.merged_at != null and .base.ref == "feat/v5-selfhost") | [.number, .head.sha, (.merge_commit_sha // "")] | @tsv' \
                  || true
              )
            fi
          fi
          if [ -n "$APPROVED_COMMIT" ]; then
            npx tsx scripts/check-changelog-guard.ts --base "$BASE_REF" --approved-commit "$APPROVED_COMMIT"
          else
            npx tsx scripts/check-changelog-guard.ts --base "$BASE_REF"
          fi

      - name: Feature flags TTL registry gate
        run: npx tsx scripts/check-feature-flags-ttl.ts

      - name: Governance gate self-tests
        run: npx tsx --test scripts/__tests__/check-docs-links.test.ts scripts/__tests__/check-ui-hard-gates.test.ts scripts/__tests__/check-no-silent-model-downgrade.test.ts scripts/__tests__/check-v5-route-sync.test.ts scripts/__tests__/check-monotonic-baselines.test.ts scripts/__tests__/check-changelog-guard.test.ts scripts/__tests__/check-feature-flags-ttl.test.ts

      - name: Prepare and flip lane isolation (temporary git, locks and artifacts only)
        run: |
          sudo env "PATH=$PATH" python3 scripts/__tests__/v5SelfhostPrepare.test.py
          sudo env "PATH=$PATH" python3 scripts/__tests__/v5SelfhostPreparedCutover.test.py
          sudo env "PATH=$PATH" python3 -B scripts/__tests__/v5SelfhostCc5Activation.test.py
          sudo env "PATH=$PATH" python3 -B scripts/__tests__/v5SelfhostCc5ActivationWiring.test.py

      - name: Gate script tests
        run: npx tsx --test scripts/__tests__/incidentLineage.test.ts scripts/__tests__/biomeChangedGate.test.ts scripts/__tests__/twoTreeDivergence.test.ts scripts/__tests__/incidentLedgerSuperset.test.ts scripts/__tests__/incidentTrailerExactCompat.test.ts scripts/__tests__/v5FixTrailerGate.test.ts scripts/__tests__/v5SelfhostCutoverIdle.test.ts scripts/__tests__/archMeasure.node-test.mjs scripts/__tests__/kernelReleaseClosure.test.ts scripts/__tests__/protocolBrowserEntry.test.ts scripts/__tests__/ocTrace.test.ts scripts/__tests__/ocTraceChain.test.ts

      - name: G8 replay gate (offline, default off)
        run: |
          npx tsx --test --test-concurrency=1 packages/protocol/src/__tests__/g8ReplayJudge.test.ts packages/commercial/src/admin/g8ReplayCheckpoint.test.ts scripts/__tests__/v5SelfhostG8Replay.test.ts
          npx tsx scripts/v5-selfhost-g8-replay.ts

      - name: Test mutex train priority (isolated SQLite and flock fixtures)
        run: python3 scripts/__tests__/testMutexTrainPriority.test.py

      # OCV5-548:kernel(脱敏/日志/trace 唯一实现)的单测;selfhost CI 不跑逐包 test:*,这里单独跑。
      - name: Kernel unit tests
        run: npm run test:kernel

      - name: Selfhost tip prewarm and artifact reuse regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sqlite3 jq rsync
          sudo node --test scripts/__tests__/v5SelfhostPrewarm.node-test.mjs scripts/__tests__/v5SelfhostDeploySpeed.node-test.mjs scripts/__tests__/selfhostSourcePin.node-test.mjs

      - name: P2 trace propagation and durable evidence (OCV5-605)
        run: |
          npx tsx --test packages/gateway/src/__tests__/delegateContext.test.ts packages/gateway/src/__tests__/delegateTrace.test.ts packages/gateway/src/__tests__/delegateTraceDurable.test.ts packages/gateway/src/__tests__/delegateAsyncJobs.test.ts packages/gateway/src/__tests__/ccbTraceHeader.test.ts
          npx tsx --test packages/commercial/src/__tests__/internalDelegateTrace.test.ts packages/commercial/src/__tests__/turnDispatchStore.test.ts packages/commercial/src/__tests__/turnDispatchReconciler.test.ts packages/commercial/src/__tests__/containerLogArchive.test.ts scripts/__tests__/containerArchiveDrill.test.ts

      - name: Context launch budgets (offline)
        run: |
          npx tsx --test --test-concurrency=1 packages/protocol/src/__tests__/contextPressure.test.ts packages/gateway/src/__tests__/boundedPrompt.test.ts packages/gateway/src/__tests__/contextObservationFrames.test.ts packages/gateway/src/__tests__/antigravityAdapter.test.ts packages/gateway/src/__tests__/ccbContextObservation.test.ts
          npx tsx --test claude-code-best/src/services/api/requestBodyBudget.node-test.mjs scripts/__tests__/ccbSharedInputs.node-test.mjs

      - name: Two-tree divergence (report only until the unified sync)
        run: npx tsx scripts/check-v5-two-tree-divergence.ts --against origin/feat/v5-aurora-rewrite

  # OCV5-542(第三阶段 §9.3 第 3 条):本阶段迁移只做加法。新增/改动的迁移里每条兼容候选语句
  # 都要有 -- compat: 声明,PR 描述要有 "## Migration compatibility" 一节逐个点名;任何一项缺失即红。
  # 独立的必过 job,不是上面 precheck 的 warning。
  migration-compat:
    name: selfhost-migration-compat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ref="origin/$BASE_REF"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ref="$BEFORE"
          else
            ref="origin/feat/v5-selfhost"
          fi
          git rev-parse --verify "$ref^{commit}" >/dev/null
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Additive-only migrations (blocking)
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            bash scripts/v5-selfhost-migration-compat-check.sh --base "${{ steps.base.outputs.ref }}" --pr-body-file "$RUNNER_TEMP/pr-body.md"
          else
            bash scripts/v5-selfhost-migration-compat-check.sh --base "${{ steps.base.outputs.ref }}"
          fi

      - name: Detector and check tests
        run: bash scripts/v5-migration-compat.test.sh

  # OCV5-543 / OCV5-847: 架构护栏规则 1–4 强制期(--enforce)。新增/增长违规、未清理的 stale 基线、
  # 基线抬升、脚本缺失、解析失败、modules.json 不合法或基线缺失均硬阻断。
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve comparison base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ref="origin/$BASE_REF"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ref="$BEFORE"
          else
            ref="origin/feat/v5-selfhost"
          fi
          git rev-parse --verify "$ref^{commit}" >/dev/null
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Architecture guardrails (enforced, against base)
        run: npx tsx scripts/check-architecture.ts --enforce --base "${{ steps.base.outputs.ref }}" --json "$RUNNER_TEMP/architecture.json"

      # OCV5-847 (Blocker 2): 同步验证无 .git staging 归档态(不传 --base)，确保纯重命名 PR 也已更新
      # arch/violations-baseline.json，防止 PR 绿而发车列车在 git archive staging 红。
      - name: Architecture guardrails (enforced, archive-mode parity)
        run: npx tsx scripts/check-architecture.ts --enforce

      - name: Checker tests
        run: npx tsx --test scripts/__tests__/checkArchitecture.test.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: ${{ runner.temp }}/architecture.json
          if-no-files-found: ignore

  # OCV5-544 / OCV5-847: 门禁 ↔ 源码路径耦合强制期(--enforce)。PR 移动/删除了某个门禁点名的路径
  # 而该门禁在 HEAD 仍点名旧路径 → UNCOVERED，或 arch/gate-couplings.json 快照过期 → 硬阻断。
  gate-couplings:
    name: gate-couplings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve comparison base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ref="origin/$BASE_REF"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ref="$BEFORE"
          else
            ref="origin/feat/v5-selfhost"
          fi
          git rev-parse --verify "$ref^{commit}" >/dev/null
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Gate couplings (enforced)
        run: npx tsx scripts/check-gate-couplings.ts --enforce --base "${{ steps.base.outputs.ref }}"

      - name: Snapshot freshness (enforced)
        run: npx tsx scripts/check-gate-couplings.ts --check --enforce

      - name: Checker tests
        run: npx tsx --test scripts/__tests__/checkGateCouplings.test.ts

  # OCV5-447:列车 pinned staging 跑的 watch / autorecover 行为门,PR 上先跑同一份清单
  # (scripts/v5-selfhost-watch-gate.sh)。此前只有列车跑,watch 改动要等一趟列车失败才知道。
  watch-gate:
    name: selfhost-watch-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch behaviour gate (same list as the train)
        run: bash scripts/v5-selfhost-watch-gate.sh --log-dir "$RUNNER_TEMP/watch-gate"

      # OCV5-539:列车 summary.json 记录器(只记录,不参与列车判定,所以不进 watch 门清单)。
      - name: Train summary recorder
        run: bash scripts/v5-selfhost-train-summary.test.sh

      - name: Workspace links (OCV5-549)
        run: bash scripts/v5-selfhost-workspace-links.test.sh

      # OCV5-581:L0 只读发车预检。每项检查用最小故障红一次、修好绿一次;另验只读与接线顺序。
      - name: L0 departure preflight (OCV5-581)
        run: |
          bash scripts/v5-release-preflight.test.sh
          node --test scripts/lib/proofDbPreflight.test.mjs

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-watch-gate-logs
          path: ${{ runner.temp }}/watch-gate
