name: V5 selfhost gates

# 个人版(feat/v5-selfhost)的仓库级门(OCV5-376)。此前这些检查只有商业 v5-ci.yml 跑
# (只触发 feat/v5-aurora-rewrite),在个人版树上从没跑过:事故账本里一条 assertion 锚点
# 早已改名也没人发现,整包 lint 永远红。这里跑的是个人版能真实通过、失败即有意义的版本。
#   · biome:只看本次改动的文件,只拦新增错误(scripts/check-biome-changed.sh);
#   · 事故账本:check-v5-incident-regressions.ts --edition=selfhost + ledger superset;
#   · 两树差异:只报告不拦(两棵树统一同步之后改成 --enforce)。

on:
  pull_request:
    branches: [feat/v5-selfhost]
  push:
    branches: [feat/v5-selfhost]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-selfhost-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: selfhost-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 账本血缘、trailer 闭环与两树差异都要完整历史和 feat/v5-aurora-rewrite。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 比较基线:PR 用目标分支;push 用推送前的 SHA(否则 origin/feat/v5-selfhost 就是 HEAD 本身,
      # 改动文件为 0、账本与自己比,门形同虚设)。新建分支的 push(before 全 0)退回目标分支。
      - name: Resolve comparison base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ref="origin/$BASE_REF"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            ref="$BEFORE"
          else
            ref="origin/feat/v5-selfhost"
          fi
          git rev-parse --verify "$ref^{commit}" >/dev/null
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "comparison base: $ref"

      - name: Biome (changed files, no new errors)
        run: bash scripts/check-biome-changed.sh --base "${{ steps.base.outputs.ref }}"

      - name: Incident ledger (selfhost edition)
        env:
          INCIDENT_LEDGER_BASE_REF: ${{ steps.base.outputs.ref }}
        run: npx tsx scripts/check-v5-incident-regressions.ts --edition=selfhost

      - name: Incident ledger superset
        env:
          INCIDENT_LEDGER_BASE_REF: ${{ steps.base.outputs.ref }}
        run: npx tsx scripts/check-incident-ledger-superset.ts

      - name: Gate script tests
        run: npx tsx --test scripts/__tests__/incidentLineage.test.ts scripts/__tests__/biomeChangedGate.test.ts scripts/__tests__/twoTreeDivergence.test.ts scripts/__tests__/incidentLedgerSuperset.test.ts scripts/__tests__/incidentTrailerExactCompat.test.ts scripts/__tests__/v5FixTrailerGate.test.ts

      - name: Two-tree divergence (report only until the unified sync)
        run: npx tsx scripts/check-v5-two-tree-divergence.ts --against origin/feat/v5-aurora-rewrite

  # OCV5-447:列车 pinned staging 跑的 watch / autorecover 行为门,PR 上先跑同一份清单
  # (scripts/v5-selfhost-watch-gate.sh)。此前只有列车跑,watch 改动要等一趟列车失败才知道。
  watch-gate:
    name: selfhost-watch-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Watch behaviour gate (same list as the train)
        run: bash scripts/v5-selfhost-watch-gate.sh --log-dir "$RUNNER_TEMP/watch-gate"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-watch-gate-logs
          path: ${{ runner.temp }}/watch-gate
