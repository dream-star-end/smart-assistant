name: Aurora v5 Windows App

on:
  pull_request:
    branches: [feat/v5-aurora-rewrite, feat/v5-windows-app]
  push:
    branches: [feat/v5-aurora-rewrite, feat/v5-windows-app]

permissions:
  contents: read

concurrency:
  group: v5-windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Windows app scope
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether installer validation is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" == "feat/v5-windows-app" || "$REF_NAME" == "feat/v5-windows-app" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            from="$BASE_SHA"
          else
            from="$BEFORE_SHA"
          fi

          if [[ -z "$from" || "$from" =~ ^0+$ ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git cat-file -e "${from}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          changed_files="$(git diff --name-only --no-renames "$from" "$HEAD_SHA")"
          if grep -Eq '^(packages/desktop/|apps/windows/|docs/V5_WINDOWS_DESKTOP\.md$|\.github/workflows/v5-windows-desktop\.yml$)' <<< "$changed_files"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  windows-nsis:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    name: Windows NSIS (unsigned)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix apps/windows ci

      - name: Check desktop package
        run: npm --prefix apps/windows run check

      - name: Build unsigned Windows NSIS package
        # PR jobs must never receive signing credentials. This workflow deliberately
        # builds unsigned artifacts on every trigger; the protected release-signing
        # lane is documented in docs/V5_WINDOWS_DESKTOP.md and is not enabled yet.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix apps/windows run dist:win

      - name: Smoke packaged executable without public network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'apps/windows/release/win-unpacked/Aurora.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "packaged executable missing: $exe"
          }
          $smokeReport = Join-Path $env:RUNNER_TEMP 'aurora-unpacked-smoke.txt'
          $env:OPENCLAUDE_SMOKE_REPORT_PATH = $smokeReport

          # --smoke-test is an offline desktop contract: it creates the trusted shell
          # and isolated product WebContentsViews, validates bridge/layout/navigation
          # boundaries against packaged local fixtures, closes both views, then exits.
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          try {
            if (-not $process.WaitForExit(45000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Aurora.exe --smoke-test exceeded the hard 45 second timeout'
            }
            $process.Refresh()
          if ($process.ExitCode -ne 0) {
            $detail = if (Test-Path -LiteralPath $smokeReport -PathType Leaf) {
              Get-Content -LiteralPath $smokeReport -Raw
            } else {
              'No application smoke report was produced.'
            }
            throw "Aurora.exe --smoke-test exited with code $($process.ExitCode)`n$detail"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke silent install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $PWD 'apps/windows/release'
          $installers = @(Get-ChildItem -LiteralPath $releaseDir -Filter 'Aurora-Setup-*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one Aurora NSIS installer, found $($installers.Count)"
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'aurora-installed-smoke'
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $install.WaitForExit(60000)) {
            Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            throw 'silent installer exceeded 60 seconds'
          }
          $install.Refresh()
          if ($install.ExitCode -ne 0) {
            throw "silent installer exited with code $($install.ExitCode)"
          }

          $installedExe = Join-Path $installDir 'Aurora.exe'
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw "installed executable missing: $installedExe"
          }
          $installedSmokeReport = Join-Path $env:RUNNER_TEMP 'aurora-installed-smoke.txt'
          $env:OPENCLAUDE_SMOKE_REPORT_PATH = $installedSmokeReport
          $smoke = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -PassThru
          if (-not $smoke.WaitForExit(45000)) {
            Stop-Process -Id $smoke.Id -Force -ErrorAction SilentlyContinue
            throw 'installed Aurora.exe --smoke-test exceeded 45 seconds'
          }
          $smoke.Refresh()
          if ($smoke.ExitCode -ne 0) {
            $detail = if (Test-Path -LiteralPath $installedSmokeReport -PathType Leaf) {
              Get-Content -LiteralPath $installedSmokeReport -Raw
            } else {
              'No installed application smoke report was produced.'
            }
            throw "installed Aurora.exe --smoke-test exited with code $($smoke.ExitCode)`n$detail"
          }

          $uninstallers = @(Get-ChildItem -LiteralPath $installDir -Filter 'Uninstall*.exe' -File)
          if ($uninstallers.Count -ne 1) {
            throw "expected exactly one Aurora uninstaller, found $($uninstallers.Count)"
          }
          $uninstall = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -PassThru
          if (-not $uninstall.WaitForExit(60000)) {
            Stop-Process -Id $uninstall.Id -Force -ErrorAction SilentlyContinue
            throw 'silent uninstaller exceeded 60 seconds'
          }
          $uninstall.Refresh()
          if ($uninstall.ExitCode -ne 0) {
            throw "silent uninstaller exited with code $($uninstall.ExitCode)"
          }
          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(20)
          while ((Test-Path -LiteralPath $installedExe) -and [DateTime]::UtcNow -lt $uninstallDeadline) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path -LiteralPath $installedExe) {
            throw 'Aurora.exe remains after silent uninstall'
          }

      - name: Generate installer SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $PWD 'apps/windows/release'
          $installers = @(Get-ChildItem -LiteralPath $releaseDir -Filter 'Aurora-Setup-*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one Aurora NSIS installer, found $($installers.Count)"
          }

          $lines = foreach ($installer in $installers) {
            $hash = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $installer.Name
          }
          $sumFile = Join-Path $releaseDir 'SHA256SUMS.txt'
          $lines | Set-Content -LiteralPath $sumFile -Encoding ascii
          Get-Content -LiteralPath $sumFile

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-x64-unsigned-${{ github.sha }}
          path: |
            apps/windows/release/Aurora-Setup-*.exe
            apps/windows/release/Aurora-Setup-*.exe.blockmap
            apps/windows/release/latest*.yml
            apps/windows/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Windows app gate
    if: ${{ always() }}
    needs: [scope, windows-nsis]
    runs-on: ubuntu-latest

    steps:
      - name: Verify required Windows result
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BUILD_REQUIRED: ${{ needs.scope.outputs.build }}
          WINDOWS_RESULT: ${{ needs.windows-nsis.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == "success" ]] || {
            echo "scope job did not succeed: $SCOPE_RESULT" >&2
            exit 1
          }
          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            [[ "$WINDOWS_RESULT" == "success" ]] || {
              echo "Windows installer validation did not succeed: $WINDOWS_RESULT" >&2
              exit 1
            }
          else
            [[ "$WINDOWS_RESULT" == "skipped" ]] || {
              echo "unexpected Windows installer result for an out-of-scope change: $WINDOWS_RESULT" >&2
              exit 1
            }
          fi
