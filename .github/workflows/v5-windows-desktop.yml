name: Aurora v5 Windows Desktop

on:
  pull_request:
    branches: [feat/v5-aurora-rewrite]
    paths:
      - 'packages/desktop/**'
      - 'docs/V5_WINDOWS_DESKTOP.md'
      - '.github/workflows/v5-windows-desktop.yml'
  push:
    branches: [feat/v5-aurora-rewrite]
    paths:
      - 'packages/desktop/**'
      - 'docs/V5_WINDOWS_DESKTOP.md'
      - '.github/workflows/v5-windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-nsis:
    name: Windows NSIS (unsigned)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix packages/desktop ci

      - name: Check desktop package
        run: npm --prefix packages/desktop run check

      - name: Build unsigned Windows NSIS package
        # PR jobs must never receive signing credentials. This workflow deliberately
        # builds unsigned artifacts on every trigger; the protected release-signing
        # lane is documented in docs/V5_WINDOWS_DESKTOP.md and is not enabled yet.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix packages/desktop run dist:win

      - name: Smoke packaged executable without public network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'packages/desktop/release/win-unpacked/Aurora.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "packaged executable missing: $exe"
          }

          # --smoke-test is an offline lifecycle contract: the application must
          # create a hidden sandboxed window, load only about:blank, then exit.
          # This step intentionally starts no local server and probes no public URL.
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Aurora.exe --smoke-test exceeded the hard 30 second timeout'
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Aurora.exe --smoke-test exited with code $($process.ExitCode)"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Generate installer SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $PWD 'packages/desktop/release'
          $installers = @(Get-ChildItem -LiteralPath $releaseDir -Filter 'Aurora-Setup-*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one Aurora NSIS installer, found $($installers.Count)"
          }

          $lines = foreach ($installer in $installers) {
            $hash = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $installer.Name
          }
          $sumFile = Join-Path $releaseDir 'SHA256SUMS.txt'
          $lines | Set-Content -LiteralPath $sumFile -Encoding ascii
          Get-Content -LiteralPath $sumFile

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-x64-unsigned-${{ github.sha }}
          path: |
            packages/desktop/release/Aurora-Setup-*.exe
            packages/desktop/release/Aurora-Setup-*.exe.blockmap
            packages/desktop/release/latest*.yml
            packages/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
