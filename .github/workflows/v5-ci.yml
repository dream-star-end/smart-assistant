name: Aurora v5 CI

# v5(feat/v5-aurora-rewrite)回归自动化。见 docs/V5_CI.md。
# 与 v3 的 .github/workflows/ci.yml(fix/v3-test-gate 分支)同源:
# 依赖安装(npm ci + setup-node cache)与 PG/Redis service 配置照抄 v3。

on:
  pull_request:
    branches: [feat/v5-aurora-rewrite]
  push:
    branches: [feat/v5-aurora-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # 关闭 fail-fast:一个套件失败不取消其余,要看全量结果
      fail-fast: false
      matrix:
        include:
          - name: typecheck
            # check:ci-parity = CI 门集合 ≡ check:v5 门集合 + docs/V5_CI.md job 表格核对,
            # 消灭"本地全量门"与"CI 全量门"两个权威源(scripts/check-ci-parity.ts)。
            run: npm run typecheck && npm run check:ci-parity
            timeout: 20
          - name: lint
            # scheduler-wiring:导出了生命周期类/工厂却没人 start 的静默死代码
            # (HealthPoller 真实事故);agent-containers-sql:读 agent_containers 必须显式
            # 过滤 state,否则 vanished 行渗进用户视图/计费聚合。
            run: npm run lint:scheduler-wiring && npm run lint:agent-containers-sql
            timeout: 10
          - name: protocol
            # protocol = gateway↔web-react↔容器的帧与错误码单一权威
            # (frames / turnErrorTaxonomy / promptQueueFrames / modelAuthority)。
            run: npm run test:protocol
            timeout: 10
          - name: channels
            run: npm run test:channels
            timeout: 10
          - name: gateway
            run: npm run test:gateway
            timeout: 25
          - name: storage
            run: npm run test:storage && npm run test:mcp-memory
            timeout: 15
          - name: web-react
            run: npm run check:v5:incidents && npm run check:v5:e2e-selectors && npm run check:tutorials && npm run test:web-react
            timeout: 30
          - name: web-react-browser
            # test:browser = 真 Chromium 组件冒烟(browser-tests):受信点击断言交互契约。
            # jsdom 对"点击→选择器弹出"类行为恒假阴性(2026-07-18 附件事故),此门前置到合并前。
            # 浏览器解析:ubuntu runner 预装 google-chrome(scripts/lib/resolve-browser.mjs),
            # 找不到浏览器 fail-loud(禁止跳过)。
            # 独立成 job(2026-07-26):此前它挂在 web-react 的 `&&` 链尾,后果有二 ——
            #   ① required check 粒度是 job 名,删掉 `&& test:browser` 后 context 照样 success
            #      (门可被无声削弱);② 163 个 jsdom 文件里任一 flake 就让最有证明力的
            #      浏览器门整场不跑。
            run: npm run test:browser
            timeout: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 教程审计门禁要读取 PR/push 前的可信历史，验证 JSONL 只能追加。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.name }}
        env:
          TUTORIAL_HISTORY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: ${{ matrix.run }}

  v5-ops:
    name: v5-ops
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # v5ReleaseSafety includes a real-psql persistence contract. Keep this job
    # separate from the pure suite matrix so only the ops lane pays for PG.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openclaude_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d openclaude_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: 'true'
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:55432/openclaude_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for test fixture
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec '${{ job.services.postgres.id }}' pg_isready -U test -d openclaude_test; then
              exit 0
            fi
            sleep 2
          done
          echo 'Postgres did not become ready in time' >&2
          exit 1

      - name: Run v5-ops
        # baseline hardening must prove production root:root ownership.
        run: |
          sudo env \
            "PATH=$PATH" \
            "CI=$CI" \
            "TEST_DATABASE_URL=$TEST_DATABASE_URL" \
            npm run test:v5:ops

  commercial-unit:
    name: commercial-unit (known-failures diff gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # PG/Redis service 配置照抄 v3 ci.yml(fix/v3-test-gate):
    # 商业 unit 套件里有 DB 门控测试(REQUIRE_TEST_DB / CI=true 时缺 DB 直接 throw,
    # 防静默 skip),必须起同款 fixture。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openclaude_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d openclaude_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: 'true'
      REQUIRE_TEST_DB: '1'
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:55432/openclaude_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/0
      COMMERCIAL_UNIT_TAP: commercial-unit.tap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for test fixtures
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec '${{ job.services.postgres.id }}' pg_isready -U test -d openclaude_test; then
              break
            fi
            if [[ "$i" == 30 ]]; then
              echo 'Postgres did not become ready in time' >&2
              exit 1
            fi
            sleep 2
          done
          for i in {1..30}; do
            if docker exec '${{ job.services.redis.id }}' redis-cli ping; then
              break
            fi
            if [[ "$i" == 30 ]]; then
              echo 'Redis did not become ready in time' >&2
              exit 1
            fi
            sleep 2
          done

      - name: Run commercial unit tests (baseline diff gate)
        env:
          TAP_OUT: ${{ env.COMMERCIAL_UNIT_TAP }}
        # v5 master 生产 unit 以 User=root 运行;provision 契约会创建并 chown
        # /run/ccb-ssh/u<uid>。GitHub runner 普通用户无法验证这条真实权限路径,
        # 会稳定 EACCES。托管 runner 本身支持 passwordless sudo,这里只透传门禁必需 env。
        run: |
          sudo env \
            "PATH=$PATH" \
            "CI=$CI" \
            "REQUIRE_TEST_DB=$REQUIRE_TEST_DB" \
            "TEST_DATABASE_URL=$TEST_DATABASE_URL" \
            "TEST_REDIS_URL=$TEST_REDIS_URL" \
            "TAP_OUT=$TAP_OUT" \
            npm run test:commercial:unit:gate

      - name: Upload TAP output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-unit-tap
          path: ${{ env.COMMERCIAL_UNIT_TAP }}
          if-no-files-found: error
          retention-days: 14

  commercial-integ:
    name: commercial-integ (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      # 一片红不取消其余:要一次看到全部分片的结果,否则每轮只能修一个。
      fail-fast: false
      matrix:
        include:
          # timeout 与 .github/integ-tiers/<shard>.txt 的 max-minutes 对齐。
          # 本机(16 核)实测:pr-1 16.5min / pr-2 6.0min / pr-3 4.3min。
          # 2 核 runner 更慢,pr-1 是长杆 —— 超预算就**拆片**,不要调大这里。
          - shard: pr-1
            timeout: 30
          - shard: pr-2
            timeout: 20
          - shard: pr-3
            timeout: 20

    # 2026-07-26 门禁审计:110 个 *.integ.test.ts / 1549 个用例在 CI、deploy、
    # playbook 三处都不跑,而单测层白纸黑字把"SQL 真行为"delegate 给它们
    # (turnDispatchStore.test.ts / preferences.test.ts 头注释)——委派链下游不存在。
    # 这个 job 把 PR 门第一梯队(.github/integ-tiers/pr-*.txt)接进 CI。
    #
    # 分片而非一把梭:PR#131 当初 integ job 撞 45min 全局 timeout 卡了 8 天。
    # 每片自带 max-minutes 预算(写在清单头),超了就该拆片,不该调大 timeout。
    #
    # fixture 与 commercial-unit 同款(postgres:16 + redis:7),整份照抄:
    # integ 的 DB/Redis 门控是 CI==='true' || REQUIRE_TEST_DB==='1',缺 fixture 必须红。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openclaude_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d openclaude_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: 'true'
      REQUIRE_TEST_DB: '1'
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:55432/openclaude_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tier manifest drift gate
        # 清单是判绿下界的权威;先证明它跟磁盘一致,再谈跑没跑。
        run: npm run lint:integ-tiers

      - name: Wait for test fixtures
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker exec '${{ job.services.postgres.id }}' pg_isready -U test -d openclaude_test; then
              break
            fi
            if [[ "$i" == 30 ]]; then
              echo 'Postgres did not become ready in time' >&2
              exit 1
            fi
            sleep 2
          done
          for i in {1..30}; do
            if docker exec '${{ job.services.redis.id }}' redis-cli ping; then
              break
            fi
            if [[ "$i" == 30 ]]; then
              echo 'Redis did not become ready in time' >&2
              exit 1
            fi
            sleep 2
          done

      - name: Run integ shard ${{ matrix.shard }}
        # 与 commercial-unit 同形:v5 master 生产以 root 跑,provision 契约要 chown
        # /run/ccb-ssh/u<uid>;普通用户会稳定 EACCES。只透传门禁必需 env。
        env:
          TAP_OUT: commercial-integ-${{ matrix.shard }}.tap
        run: |
          sudo env \
            "PATH=$PATH" \
            "CI=$CI" \
            "REQUIRE_TEST_DB=$REQUIRE_TEST_DB" \
            "TEST_DATABASE_URL=$TEST_DATABASE_URL" \
            "TEST_REDIS_URL=$TEST_REDIS_URL" \
            "TAP_OUT=$TAP_OUT" \
            bash .github/scripts/commercial-integ-gate.sh '${{ matrix.shard }}'

      - name: Upload TAP output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-integ-tap-${{ matrix.shard }}
          path: commercial-integ-${{ matrix.shard }}.tap
          if-no-files-found: error
          retention-days: 14
