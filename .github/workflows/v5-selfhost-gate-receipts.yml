name: V5 selfhost merge-queue gate receipts

# DRAFT gate-policy change. Train consumption remains OFF until separately approved.
# Existing PR/release gates and their authoritative manifest are unchanged.
on:
  pull_request:
    branches: [feat/v5-selfhost]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: selfhost-gate-receipts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  receipt-tests:
    name: selfhost-gate-receipt-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/__tests__/selfhostGateReceipt.test.ts scripts/__tests__/checkReleaseGateParity.test.ts
      - run: npx tsx scripts/check-release-gate-parity.ts
      - name: Receipt typecheck
        run: npx tsc --noEmit --strict --skipLibCheck --esModuleInterop --allowImportingTsExtensions --module NodeNext --moduleResolution NodeNext --target ES2022 scripts/lib/selfhostGateReceipt.ts scripts/v5-selfhost-gate-receipts.ts scripts/__tests__/selfhostGateReceipt.test.ts
      - run: bash -n scripts/lib/v5-selfhost-gate-receipts.sh scripts/v5-selfhost-master-release-lib.sh

  gates:
    name: selfhost-receipted-gates
    if: github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/feat/v5-selfhost'
    needs: receipt-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Candidate execution must not have signing credentials, including through npm install.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: claude-code-best
      - id: gate_delegate_billing_requestid
        run: npx --no-install tsx scripts/check-v5-delegate-billing-requestid.ts
      - id: gate_callback_payload_hash
        run: node scripts/check-v5-callback-payload-hash.mjs
      - id: gate_cron_submit_boundary
        run: npx --no-install tsx scripts/check-v5-cron-submit-boundary.ts
      - id: gate_prompt_privacy_lifecycle
        run: npx --no-install tsx scripts/check-v5-prompt-privacy-proofs.ts
      - id: gate_system_approval_fencing
        run: npx --no-install tsx scripts/check-v5-system-approval-proofs.ts
      - id: gate_system_executor_fencing
        run: npx --no-install tsx scripts/check-v5-system-executor-proofs.ts
      - id: gate_session_unavailable_rootfix
        run: npx --no-install tsx scripts/check-v5-session-unavailable-rootfix.ts
      - id: gate_watch_gate
        run: bash scripts/v5-selfhost-watch-gate.sh --log-dir "$RUNNER_TEMP/watch-gate"
      - name: Issue only after every eligible gate passed
        env:
          GATE_RESULTS: ${{ toJSON(steps) }}
          RECEIPT_SHA: ${{ github.event.merge_group.head_sha }}
        run: node --import tsx scripts/v5-selfhost-gate-receipts.ts issue "$GITHUB_WORKSPACE" "$RECEIPT_SHA" "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-gate-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 7

  attest:
    name: selfhost-attest-gate-receipt
    needs: gates
    if: github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/feat/v5-selfhost'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    # Fresh runner; no checkout, npm install, shell script or candidate-code execution here.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-gate-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-receipt
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: ${{ runner.temp }}/gate-receipt/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selfhost-gate-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
