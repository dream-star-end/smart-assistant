name: V5 selfhost web-react

# 个人版(feat/v5-selfhost)此前没有任何托管 CI:v5-ci.yml 只触发 feat/v5-aurora-rewrite,
# deploy-v5-selfhost.sh 也不跑前端单测,于是过期用例在个人版攒到 18 条(OCV5-343)。
# 这里跑与商业 required `web-react` job 相同的前端全量单测,让红在 push/PR 时就可见。
# test:browser 暂不进本 workflow:个人版首次托管跑出 8 例 node-test 红 + run.mjs 顺序依赖级联,见 OCV5-355。
# 不进 check:ci-parity(它只核对 v5-ci.yml ≡ check:v5),也不改任何发布脚本的门。

on:
  pull_request:
    branches: [feat/v5-selfhost]
  push:
    branches: [feat/v5-selfhost]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-selfhost-web-react-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-react:
    name: selfhost-web-react
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web-react unit tests
        run: npm run test:web-react
