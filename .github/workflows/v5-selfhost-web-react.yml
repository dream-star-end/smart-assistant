name: V5 selfhost web-react

# 个人版(feat/v5-selfhost)此前没有任何托管 CI:v5-ci.yml 只触发 feat/v5-aurora-rewrite,
# deploy-v5-selfhost.sh 也不跑前端单测,于是过期用例在个人版攒到 18 条(OCV5-343)。
# 这里跑与商业 `web-react` / `web-react-browser` job 相同的两条前端命令,让红在 push/PR 时就可见。
# 不进 check:ci-parity(它只核对 v5-ci.yml ≡ check:v5),也不改任何发布脚本的门。

on:
  pull_request:
    branches: [feat/v5-selfhost]
  push:
    branches: [feat/v5-selfhost]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-selfhost-web-react-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # OCV5-497: shard across isolated runners; retain the existing worker/timeouts.
  web-react-shards:
    name: selfhost-web-react (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check shard tooling
        run: node --test .github/scripts/web-react-shards.test.mjs

      - name: Collect full web test inventory
        if: matrix.shard == 1
        working-directory: packages/web-react
        run: node ../../node_modules/vitest/vitest.mjs list --filesOnly --json="$RUNNER_TEMP/web-react-inventory.json"

      - name: Run web-react unit tests
        run: npm run test --workspace packages/web-react -- --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/web-react-report.json"

      - name: Upload shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-web-react-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/web-react-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload full inventory
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-web-react-inventory
          path: ${{ runner.temp }}/web-react-inventory.json
          if-no-files-found: error
          retention-days: 7

  web-react:
    name: selfhost-web-react
    if: ${{ always() }}
    needs: web-react-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard job to succeed
        env:
          SHARD_RESULT: ${{ needs.web-react-shards.result }}
        run: test "$SHARD_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          pattern: selfhost-web-react-*
          path: ${{ runner.temp }}/web-react-shards

      - name: Verify complete test-file coverage
        env:
          SHARD_RESULT: ${{ needs.web-react-shards.result }}
        run: |
          node .github/scripts/check-web-react-shards.mjs "$SHARD_RESULT" \
            "$RUNNER_TEMP/web-react-shards/selfhost-web-react-inventory/web-react-inventory.json" \
            "$RUNNER_TEMP/web-react-shards/selfhost-web-react-report-1/web-react-report.json" \
            "$RUNNER_TEMP/web-react-shards/selfhost-web-react-report-2/web-react-report.json"

  web-react-browser:
    # 与 v5-ci 的 web-react-browser 同一命令与同样的 runner 准备(CJK 字体 + 产物目录)。OCV5-355 清绿后加入:
    # 首次托管失败里 OCV5-265 正文高度断言就是缺 CJK 字体按回退字形排版造成的。
    name: selfhost-web-react-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 界面是中文。托管 runner 没有 CJK 字体时汉字按回退字形排版,行数和高度都和用户看到的不一样。
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # 浏览器门把截图和预览地址写到 /home/agent/.openclaude/generated;托管 runner 默认无权创建。
      - name: Prepare browser artifact directory
        run: sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /home/agent/.openclaude/generated

      - name: Run web-react-browser
        run: npm run test:browser

      # OCV5-431: the selfhost C1-C3 contract gate browser tests (clickSend, settle,
      # continuation) live in scripts/lib and were never run by CI; same runner and browser.
      - name: Contract gate browser tests (scripts/lib)
        run: node --test scripts/lib/user-contract-*.test.mjs
