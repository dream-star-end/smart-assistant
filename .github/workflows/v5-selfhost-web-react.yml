name: V5 selfhost web-react

# 个人版(feat/v5-selfhost)此前没有任何托管 CI:v5-ci.yml 只触发 feat/v5-aurora-rewrite,
# deploy-v5-selfhost.sh 也不跑前端单测,于是过期用例在个人版攒到 18 条(OCV5-343)。
# 这里跑与商业 `web-react` / `web-react-browser` job 相同的两条前端命令,让红在 push/PR 时就可见。
# 不进 check:ci-parity(它只核对 v5-ci.yml ≡ check:v5),也不改任何发布脚本的门。

on:
  pull_request:
    branches: [feat/v5-selfhost]
  push:
    branches: [feat/v5-selfhost]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-selfhost-web-react-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-react:
    name: selfhost-web-react
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web-react unit tests
        run: npm run test:web-react

  web-react-browser:
    # 与 v5-ci 的 web-react-browser 同一命令:真 Chromium 跑 browser-tests(含 OCV5-343 挑回的两条事故回归)。
    name: selfhost-web-react-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare browser-test artifact dir
        # 与 v5-ci 相同:browser-tests 把截图/证据写到 /home/agent/.openclaude/generated,runner 默认无权创建。
        run: sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /home/agent/.openclaude/generated

      - name: Run web-react-browser
        run: npm run test:browser
